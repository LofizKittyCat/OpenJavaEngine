plugins {
    id 'java'
    id 'application'
}

dependencies {
    implementation project(':core')

    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
    testRuntimeOnly    "org.junit.platform:junit-platform-launcher"
}

application {
    mainClass = 'dev.lofiz.Main'

    // LWJGL requires the JVM to load natives from the classpath and also
    // needs XstartOnFirstThread on macOS.
    applicationDefaultJvmArgs = [
            '-XstartOnFirstThread',   // macOS only — harmless on Linux/Win
            '-Djava.library.path=.',
    ]
}

tasks.register('runSandbox') {
    dependsOn 'run'
    group = 'sandbox'
    description = 'Launch the sandbox game window'
}